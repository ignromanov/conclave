# Single source of pytest config for the whole repo (GH#99).
#
# Why repo-root and not engine/scripts/pyproject.toml: pytest resolves rootdir by walking
# UP from its args/cwd, so a config nested in engine/scripts/ is only found for some
# invocations — `pytest engine/scripts/tests` found it but the explicit arg overrode its
# testpaths (feedback/tests never collected), while bare `pytest` from the repo root never
# found it at all (no pythonpath -> ModuleNotFoundError; no testpaths -> collection
# descended into worktrees/ and aborted on duplicate package names). One root config makes
# every invocation resolve the same rootdir, pythonpath, and suite set.
#
# The suite-coverage gate (tests/test_gates.py::test_all_test_files_inside_declared_testpaths)
# fails if a test_*.py exists outside the testpaths declared here.
[pytest]
testpaths =
    engine/scripts/tests
    engine/scripts/feedback/tests
pythonpath =
    engine/scripts
    engine/scripts/lifecycle
    engine/scripts/feedback
# `-rfEs` lists every failed test, errored test, and skipped test with its reason. Without
# the `s` the configured `-q` hides both the skip list and the `N passed, M skipped`
# trailer, so a gate that skips ITSELF — the ruff gate did, for a whole session — is
# indistinguishable from one that passed (#56B, GH#45). CI passed `-rs` on the command
# line and was therefore strictly stronger than every local run; putting it in addopts
# closes that gap for every invocation.
#
# `f` and `E` were added after a session read a 35-failure run as clean three separate
# times. `-rs` alone prints no short summary for failures, so `grep FAILED` over a red
# run returns nothing and reads exactly like a green one — the flag meant to make skips
# visible was quietly certifying failures as absent.
#
# `--strict-markers` turns a misspelled @pytest.mark.<name> into a collection error. Without
# it, `@pytest.mark.live_instnace` is a silently inert decorator: the test loses its gate,
# runs hermetically, and reports green — the same shape of false-clean as GH#105 itself.
addopts = --tb=short -q -rfEs --strict-markers
norecursedirs = .* build dist node_modules worktrees
markers =
    live_instance: reads a real instance tree named by CONCLAVE_LIVE_INSTANCE_ROOT. Skipped
        when that variable is unset, so the default suite stays hermetic; the CI live-lane job
        seeds a fresh instance and runs `-m live_instance` (GH#105).
