[project]
name = "conclave-engine"
version = "0.1.0"
description = "Conclave engine — unified Python CLI + enginelib core (spec 099)"
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0",
    "ruamel.yaml>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "mypy>=1.10"]

[project.scripts]
engine = "engine.__main__:main"

# Build backend required for `[project.scripts]` entry points to be installed into the venv.
# package=false suppresses install (entry point not generated); using hatchling instead
# with explicit package selection so `uv run engine --help` works.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only ship the dispatcher + core lib; briefing/feedback stay path-accessible via PYTHONPATH.
packages = ["engine", "enginelib"]

# pytest config lives at the repo-root pytest.ini (GH#99): a config nested here is only
# found when pytest's rootdir walk happens to pass through engine/scripts/, which made the
# suite set depend on the invocation. Keep exactly one config.

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501 (line-too-long) is owned by a formatter, not the linter. The bash→Python port (099) never
# established a green line-length baseline; hand-wrapping ~160 lines (much of it test data/docstrings)
# is churn with no correctness value. Adopt `ruff format` in a follow-up to own line-length, then drop
# this ignore. Every other E/F/I/UP/B rule IS enforced (see tests/test_ruff_gate.py).
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test modules manipulate sys.path before importing the module-under-test — E402 is intentional there.
"**/tests/**" = ["E402"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
