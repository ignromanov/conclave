name: CI

# Until this file existed the repo had no CI at all, while its specs and docs spoke of gates:
# the publication gate, the code/data gate, the suite-coverage gate, the charter test and the
# lint gate all ran only when an agent remembered to run them (GH#40). They run here now.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the measured floor (engine/scripts/pyproject.toml requires-python, established
        # by import sweep rather than by declaration); 3.13 is what the engine is developed
        # against. Running both is what keeps the floor from becoming a claim nobody tests.
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # test_python_floor.py's 12 behavioural tests need an interpreter BELOW the floor to prove
      # each entrypoint refuses readably instead of crashing. They find one by probing
      # /usr/bin/python3, python3.9 and python3.10 — on a macOS dev box /usr/bin/python3 is 3.9
      # and they run, but on this runner it is itself above the floor and the others are absent,
      # so they skipped and CI was silently weaker than a laptop on the very invariant it guards.
      # `update-environment: false` keeps the matrix interpreter the active one.
      - name: Provide a sub-floor interpreter for the floor tests
        id: subfloor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          update-environment: false

      - name: Put it on PATH as python3.10
        run: ln -sf "${{ steps.subfloor.outputs.python-path }}" /usr/local/bin/python3.10

      # Same guard idiom as the ruff step below, for the same reason: the floor tests skip
      # themselves when they cannot find a sub-floor interpreter, so without this a broken
      # symlink would return CI to reporting green on 12 tests that never ran.
      - name: Assert the sub-floor interpreter is discoverable
        run: python3.10 -c "import sys; assert sys.version_info < (3, 11), sys.version; print(sys.version)"

      - name: Install engine + dev extras
        run: pip install -e './engine/scripts[dev]'

      # tests/test_ruff_gate.py skips itself when it cannot find ruff, so a runner without ruff
      # would report green on a gate that never executed. Fail here, loudly, instead — a missing
      # linter is a broken CI, not a passing one.
      - name: Assert the lint gate can run
        run: ruff --version

      # tests/test_mypy_gate.py skips itself when it cannot find mypy, so a runner without
      # mypy would report green on a gate that never executed — the same failure mode that let
      # a real signature error (post_commit.py calling advisors_from_commit_diff() with a
      # missing argument) ship undetected. Fail here, loudly, instead.
      - name: Assert the type gate can run
        run: mypy --version

      # pytest.ini at the repo root is the single source of config (GH#99) — rootdir, pythonpath
      # and both testpaths. Invoke it bare from the repo root, exactly as the docs prescribe; any
      # narrower invocation resolves a different rootdir and a different suite set.
      #
      # `-rs` is the one addition: it lists every skipped test with its reason, and (per GH#45)
      # it is also what restores the `N passed, M skipped` trailer that the configured `-q` loses.
      # A CI log that shows neither its total nor its skips cannot distinguish a green suite from
      # a suite that quietly declined to run — which is the failure this workflow exists to close.
      - name: Suite
        run: python -m pytest -rs

  # The `live_instance`-marked tests read a real instance tree instead of a synthetic fixture,
  # so they cannot run in the job above — that suite is hermetic by construction. They spent a
  # month executing nowhere for want of this job (GH#105): the opt-in existed, nothing supplied
  # its input, and 31 tests reported `skipped` on every run, locally and here.
  #
  # The instance is scaffolded by the real `conclave_init.py`, not hand-built, which is the whole
  # point: these tests assert that the path resolvers and the briefing scans agree with the layout
  # the engine's OWN scaffolder produces. A hand-written fixture tree would only assert that the
  # fixture matches the tests.
  #
  # The seed/assert/run/no-skips sequence used to live here as three shell steps, and nowhere
  # else — so the one lane that catches instance-layout regressions could not be run before
  # pushing. It found the single semantic change in a 26-file refactor that the author's own
  # local suite had called clean (PR #144). It is now `engine test live`, and this job invokes
  # that verb rather than restating it: the lane a developer runs is the same lane, not a
  # second copy of it. engine/scripts/tests/test_live_lane_is_not_a_second_copy.py reddens if
  # the steps grow back.
  live-instance:
    name: live lane · seeded instance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install engine + dev extras
        run: pip install -e './engine/scripts[dev]'

      # Seeds a throwaway instance with the real scaffolder, points the marker's fixture at it,
      # runs `-m live_instance`, and fails on a skip, an empty selection, or a red test. Each of
      # those three has previously reported green: the marked tests skip when the root is unset
      # and pytest exits 0 on an all-skipped run, and a mistyped marker collects nothing and
      # exits 5. `enginelib/live_lane.py::verdict` separates them; the reason is printed.
      - name: Live lane
        run: python -m engine test live
